name: Deploy SocialEvent Backend

on:
  push:
    branches:
      - devopsFeature
    paths:
      - "Backend/**"

  pull_request:
    branches:
      - devopsFeature
    paths:
      - "Backend/**"


jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Build Docker Image
        run: |
          docker build \
          -t socialevent-backend \
          ./Backend


      - name: Trigger Render Deployment
        if: github.event_name == 'push'
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"