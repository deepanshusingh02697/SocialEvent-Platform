services:
  postgres:
    image: postgres:16-alpine
    container_name: socialevent-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pos123@&
      POSTGRES_DB: SocialEvent_Platform

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SocialEvent_Platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: socialevent-backend
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./Backend/.env

    ports:
      - "4003:4003"

# Bind mount for the developement when actively coding due to which No rebuild after every code change. and Great with nodemon or tsx --watch
    # volumes:
    #   - ./Backend:/app
    #   - /app/node_modules

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_URL: http://localhost:4003/graphql
        VITE_WS_URL: http://localhost:4003

    container_name: socialevent-frontend
    restart: always

    depends_on:
      - backend

    env_file:
      - ./Client/.env

    ports:
      - "3000:80"

volumes:
  postgres_data: